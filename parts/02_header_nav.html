  <!-- Main App Header (Desktop Top Nav) -->
  <header class="sticky top-0 z-40 bg-carbon-950/90 backdrop-blur-xl border-b border-carbon-700/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Title & Locked V6 Status Tag -->
      <div class="flex items-center gap-3">
        <a href="#overview" onclick="switchView('view-overview')" class="flex items-center gap-2.5 group">
          <div class="w-8 h-8 rounded-lg bg-carbon-900 border border-carbon-700/80 flex items-center justify-center text-emerald-400 font-mono font-bold text-sm shadow-sm group-hover:border-emerald-500/50 group-hover:shadow-[0_0_12px_rgba(16,185,129,0.15)] transition-all">
            Q
          </div>
          <div class="flex flex-col">
            <span class="text-xs sm:text-sm font-extrabold tracking-tight text-carbon-100 flex items-center gap-2">
              AI META-Q
              <span class="text-[9px] font-mono px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold uppercase tracking-wider">
                LOCKED V6
              </span>
            </span>
            <span class="text-[10px] text-carbon-400 font-mono hidden sm:inline">Quantitative Crash Deployment Engine</span>
          </div>
        </a>
      </div>

      <!-- Desktop Navigation Tabs -->
      <nav class="hidden lg:flex items-center gap-1.5 text-xs font-semibold">
        <button onclick="switchView('view-overview')" id="desk-view-overview" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60 nav-tab-active">
          Overview
        </button>
        <button onclick="switchView('view-sandbox')" id="desk-view-sandbox" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Backtest & Projector
        </button>
        <button onclick="switchView('view-empirical')" id="desk-view-empirical" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Empirical Proof
        </button>
        <button onclick="switchView('view-balancer')" id="desk-view-balancer" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Portfolio Balancer
        </button>
        <button onclick="switchView('view-sniper')" id="desk-view-sniper" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Tactical Sniper
        </button>
        <button onclick="switchView('view-scanner')" id="desk-view-scanner" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Crash Scanner
        </button>
        <button onclick="switchView('view-faq')" id="desk-view-faq" class="view-nav-btn px-3 py-1.5 rounded-lg transition-all text-carbon-400 hover:text-carbon-100 hover:bg-carbon-900/60">
          Audit FAQ
        </button>
      </nav>

      <!-- Utility Actions (Backup, Restore, Reset, Theme Toggle) -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Dark/Light Mode" class="px-2.5 py-1.5 rounded-lg bg-carbon-900 hover:bg-carbon-800 text-carbon-300 text-xs font-medium border border-carbon-700 transition flex items-center gap-1.5 shadow-sm">
          <svg id="themeIconSun" class="w-3.5 h-3.5 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="themeIconMoon" class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <span id="themeLabel" class="hidden sm:inline">Theme</span>
        </button>
        <button onclick="exportBackup()" title="Download JSON Backup" class="px-2.5 py-1.5 rounded-lg bg-carbon-900 hover:bg-carbon-800 text-carbon-300 text-xs font-medium border border-carbon-700 transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span class="hidden sm:inline">Export</span>
        </button>
        <label title="Import JSON Backup" class="cursor-pointer px-2.5 py-1.5 rounded-lg bg-carbon-900 hover:bg-carbon-800 text-carbon-300 text-xs font-medium border border-carbon-700 transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span class="hidden sm:inline">Import</span>
          <input type="file" id="backupFileInput" class="hidden" accept=".json" onchange="importBackup(event)" />
        </label>
        <button onclick="resetDefaults()" title="Reset to Strategy Defaults" class="px-2.5 py-1.5 rounded-lg bg-carbon-900 hover:bg-rose-950/40 text-carbon-400 hover:text-rose-400 text-xs border border-carbon-700 transition shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toastNotification" class="fixed top-20 right-4 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 bg-carbon-900 border border-carbon-700 shadow-2xl rounded-xl px-4 py-3 flex items-center gap-3 text-xs sm:text-sm text-carbon-100 max-w-sm pointer-events-none">
    <div id="toastIcon" class="w-5 h-5 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center flex-shrink-0 font-mono text-xs font-bold border border-emerald-500/20">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <div id="toastMessage" class="font-sans">Action completed successfully</div>
  </div>

  <!-- Main Content Wrap -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 pb-28 lg:pb-16 space-y-8 sm:space-y-10">
